[package]
name = "oscortex-init"
version = "0.1.0"
edition = "2021"

# Keep this crate out of the root workspace — it has different build-std requirements.
[workspace]

[[bin]]
name = "init"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = false
