name: oscortex_net
description: >
  OSCortex app networking — a TCP socket + minimal HTTP client for userspace
  Flutter apps, over the `oscortex/net` platform channel into the kernel TCP
  stack. (DNS by hostname lands in a follow-up; pass an IP for now.)
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
