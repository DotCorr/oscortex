name: Release

# Production release pipeline. Every push/merge to main cuts a new release:
#   - version is auto-derived from the latest v*.*.* tag (patch bump),
#     starting at v0.0.1 when no tag exists yet,
#   - the bootable kernel ISO is built via the canonical `cargo xtask iso` path,
#   - a GitHub Release is published with the ISO attached and the tag created.
#
# main is protected (see scripts/setup-github.sh), so the only way here is a
# reviewed PR merge — that is the compliance gate for what ships.
on:
  push:
    branches: [main]
  # Manual re-cut / first release without waiting for a push.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LIMINE_BRANCH: v8.x-binary

jobs:
  release:
    name: Build ISO + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need all tags to compute the next version

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$latest" ]; then
            next="0.0.1"
          else
            base="${latest#v}"
            IFS='.' read -r major minor patch <<< "$base"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Next release: v$next (previous: ${latest:-none})"

      - name: Install Rust (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install nightly
          rustup component add rust-src
          rustup target add x86_64-unknown-none
          rustup target add aarch64-unknown-none

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-${{ runner.os }}-

      - name: Install ISO toolchain (xorriso + Limine)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso build-essential
          git clone https://github.com/limine-bootloader/limine.git \
            --branch="$LIMINE_BRANCH" --depth=1 "$HOME/limine"
          make -C "$HOME/limine"
          # xtask copies binaries from $LIMINE_DIR and shells out to `limine`.
          echo "LIMINE_DIR=$HOME/limine" >> "$GITHUB_ENV"
          echo "$HOME/limine" >> "$GITHUB_PATH"

      - name: Build bootable ISO (x86_64)
        run: cargo xtask iso

      - name: Build kernel (aarch64)
        # aarch64 boots via QEMU `-kernel` (no Limine/ISO on -M virt), so the
        # release artifact is the raw kernel ELF. This is platform-scope parity
        # with the x86 ISO above: the automated build embeds whatever is committed
        # under initramfs/ (the full render-capable Flutter runtime — engine .so,
        # AOT shell snapshot, ICU, assets — is gitignored and staged separately by
        # scripts/build-aarch64-shell.sh, exactly like the x86 full-shell ISO).
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-unknown-none -p oscortex-kernel \
            --no-default-features --features arch-aarch64 \
            -Z build-std=core,compiler_builtins,alloc \
            -Z build-std-features=compiler-builtins-mem

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          # x86_64 bootable ISO
          cp oscortex.iso "dist/oscortex-${{ steps.ver.outputs.tag }}.iso"
          sha256sum "dist/oscortex-${{ steps.ver.outputs.tag }}.iso" \
            > "dist/oscortex-${{ steps.ver.outputs.tag }}.iso.sha256"
          # aarch64 kernel ELF
          cp target/aarch64-unknown-none/release/kernel \
            "dist/oscortex-aarch64-${{ steps.ver.outputs.tag }}.kernel"
          sha256sum "dist/oscortex-aarch64-${{ steps.ver.outputs.tag }}.kernel" \
            > "dist/oscortex-aarch64-${{ steps.ver.outputs.tag }}.kernel.sha256"
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: OSCortex ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Automated production release built from `main`.

            **Artifacts:**
            - `oscortex-<tag>.iso` — x86_64 bootable kernel ISO (Limine BIOS + UEFI),
              built via `cargo xtask iso`.
            - `oscortex-aarch64-<tag>.kernel` — aarch64 kernel ELF; boot with
              `qemu-system-aarch64 -M virt -cpu cortex-a72 -kernel <file> -device ramfb`.

            Both are **platform-scope** builds. The full render-capable Flutter shell
            (engine `.so` + AOT app snapshot + ICU + assets) is gitignored and staged
            separately — x86 via `scripts/build-iso.sh`, aarch64 via
            `scripts/build-aarch64-shell.sh` (which pulls the engine + `gen_snapshot`
            from the `oscortex-engine-1` release). Wiring that runtime into the
            automated release is a tracked follow-up.

            Verify with the attached `.sha256` files.
          files: |
            dist/oscortex-${{ steps.ver.outputs.tag }}.iso
            dist/oscortex-${{ steps.ver.outputs.tag }}.iso.sha256
            dist/oscortex-aarch64-${{ steps.ver.outputs.tag }}.kernel
            dist/oscortex-aarch64-${{ steps.ver.outputs.tag }}.kernel.sha256
