name: Release

# Production release pipeline. Every push/merge to main cuts a new release:
#   - version is auto-derived from the latest v*.*.* tag (patch bump),
#     starting at v0.0.1 when no tag exists yet,
#   - the bootable kernel ISO is built via the canonical `cargo xtask iso` path,
#   - a GitHub Release is published with the ISO attached and the tag created.
#
# main is protected (see scripts/setup-github.sh), so the only way here is a
# reviewed PR merge — that is the compliance gate for what ships.
on:
  push:
    branches: [main]
  # Manual re-cut / first release without waiting for a push.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LIMINE_BRANCH: v8.x-binary

jobs:
  release:
    name: Build ISO + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need all tags to compute the next version

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$latest" ]; then
            next="0.0.1"
          else
            base="${latest#v}"
            IFS='.' read -r major minor patch <<< "$base"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Next release: v$next (previous: ${latest:-none})"

      - name: Install Rust (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install nightly
          rustup component add rust-src
          rustup target add x86_64-unknown-none
          rustup target add aarch64-unknown-none

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-${{ runner.os }}-

      - name: Install ISO toolchain (xorriso + Limine)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso build-essential
          git clone https://github.com/limine-bootloader/limine.git \
            --branch="$LIMINE_BRANCH" --depth=1 "$HOME/limine"
          make -C "$HOME/limine"
          # xtask copies binaries from $LIMINE_DIR and shells out to `limine`.
          echo "LIMINE_DIR=$HOME/limine" >> "$GITHUB_ENV"
          echo "$HOME/limine" >> "$GITHUB_PATH"

      - name: Build bootable ISO (x86_64)
        run: cargo xtask iso

      - name: Build kernel (aarch64, render-capable)
        # aarch64 boots via QEMU `-kernel` (no Limine/ISO on -M virt), so the
        # release artifact is the raw kernel ELF. Unlike the x86 ISO (still
        # platform-scope), the aarch64 kernel is RENDER-CAPABLE: we fetch the
        # prebuilt Flutter shell runtime (engine .so + AOT shell snapshot + ICU +
        # fonts/assets + embedder /init + libc + seed) from the `oscortex-engine-1`
        # release and stage it into initramfs/ before building, so kernel/build.rs
        # embeds it. The runtime is gitignored (large, prebuilt), hence the fetch.
        # NOTE: refresh `oscortex-arm64-shell-runtime.tar.gz` on that release when
        # the shell Dart/app or engine changes — it is a prebuilt snapshot.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fetch + verify the render runtime bundle.
          gh release download oscortex-engine-1 --repo "$GITHUB_REPOSITORY" \
            -p 'oscortex-arm64-shell-runtime.tar.gz' \
            -p 'oscortex-arm64-shell-runtime.tar.gz.sha256' -O /tmp/rt.tar.gz \
            --clobber || gh release download oscortex-engine-1 --repo "$GITHUB_REPOSITORY" \
            -p 'oscortex-arm64-shell-runtime.tar.gz' -O /tmp/rt.tar.gz --clobber
          if [ -f oscortex-arm64-shell-runtime.tar.gz.sha256 ]; then
            exp=$(awk '{print $1}' oscortex-arm64-shell-runtime.tar.gz.sha256)
            got=$(sha256sum /tmp/rt.tar.gz | awk '{print $1}')
            [ "$exp" = "$got" ] || { echo "runtime sha256 mismatch"; exit 1; }
          fi
          # Stage into initramfs/ (kernel/build.rs embeds it).
          mkdir -p initramfs
          tar -xzf /tmp/rt.tar.gz -C initramfs
          ls -lh initramfs/init initramfs/system/lib/libflutter_engine.so \
                 initramfs/system/flutter/libapp.so
          # Build the render-capable kernel (embeds the staged runtime).
          touch kernel/src/fs/initramfs.rs
          cargo build --release --target aarch64-unknown-none -p oscortex-kernel \
            --no-default-features --features arch-aarch64 \
            -Z build-std=core,compiler_builtins,alloc \
            -Z build-std-features=compiler-builtins-mem
          # Also build the UEFI/Limine bootable ISO (the same render runtime is
          # already staged in initramfs/). This is what boots in UTM / VMs / bare
          # metal — a real ISO, not just the raw -kernel ELF. build-iso-aarch64.sh
          # builds a higher-half limine-boot kernel and packages it with
          # BOOTAA64.EFI; LIMINE_DIR was exported by the limine install step.
          LIMINE_DIR="$HOME/limine" bash scripts/build-iso-aarch64.sh
          ls -lh oscortex-aarch64.iso

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          tag="${{ steps.ver.outputs.tag }}"
          # Arch-labelled names. Each arch ships a bootable ISO (UEFI) AND, for
          # aarch64, the raw -kernel ELF for QEMU `-M virt -kernel` users.
          cp oscortex.iso "dist/oscortex-x86_64-${tag}.iso"
          cp oscortex-aarch64.iso "dist/oscortex-aarch64-${tag}.iso"
          cp target/aarch64-unknown-none/release/kernel "dist/oscortex-aarch64-${tag}.kernel"
          # Checksums computed from inside dist/ so each .sha256 lists a bare
          # filename and `sha256sum -c` works after downloading just the pair.
          ( cd dist
            sha256sum "oscortex-x86_64-${tag}.iso"     > "oscortex-x86_64-${tag}.iso.sha256"
            sha256sum "oscortex-aarch64-${tag}.iso"    > "oscortex-aarch64-${tag}.iso.sha256"
            sha256sum "oscortex-aarch64-${tag}.kernel" > "oscortex-aarch64-${tag}.kernel.sha256" )
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: OSCortex ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Automated production release built from `main`.

            Both architectures ship a **bootable UEFI ISO** — flash it or attach it
            in UTM / a VM / bare metal. aarch64 additionally ships the raw `-kernel`
            ELF for `qemu-system-aarch64 -M virt -kernel` users.

            **Artifacts:**
            - `oscortex-x86_64-<tag>.iso` — x86_64 bootable kernel ISO (Limine BIOS +
              UEFI), built via `cargo xtask iso`.
            - `oscortex-aarch64-<tag>.iso` — **render-capable** aarch64 UEFI ISO
              (Limine → higher-half kernel), embedding the full Flutter shell runtime
              (engine + AOT shell snapshot + ICU + fonts/assets). This is the image to
              boot in **UTM / VMs / bare metal**. In UTM use a single CPU core
              (OSCortex runs a cooperative single-core scheduler).
            - `oscortex-aarch64-<tag>.kernel` — the same render-capable kernel as a raw
              ELF for direct QEMU boot:
              ```
              qemu-system-aarch64 -M virt -cpu cortex-a72 -smp 1 -m 2G \
                -kernel oscortex-aarch64-<tag>.kernel -device ramfb \
                -device virtio-tablet-device -device virtio-keyboard-device
              ```
              Wait ~60–90s (TCG warm-up) for the shell to paint; the virtio-tablet
              gives mouse hover/click.

            Verify with the attached `.sha256` files.
          files: |
            dist/oscortex-x86_64-${{ steps.ver.outputs.tag }}.iso
            dist/oscortex-x86_64-${{ steps.ver.outputs.tag }}.iso.sha256
            dist/oscortex-aarch64-${{ steps.ver.outputs.tag }}.iso
            dist/oscortex-aarch64-${{ steps.ver.outputs.tag }}.iso.sha256
            dist/oscortex-aarch64-${{ steps.ver.outputs.tag }}.kernel
            dist/oscortex-aarch64-${{ steps.ver.outputs.tag }}.kernel.sha256
